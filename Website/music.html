
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music | Jules Daud</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background: #080808;
      color: #f4f4f4;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    body .header {
      position: relative;
      flex-shrink: 0;
    }

    .music-layout {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 45px 25px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .music-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .music-heading h1 {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: clamp(50px, 6vw, 70px);
      font-weight: 500;
      letter-spacing: 5px;
    }

    .music-heading p {
      color: #888;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    /* THREE PLATFORMS */

    .platform-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .platform-card {
      min-width: 0;
      height: 240px;
      border: 1px solid #292929;
      background: #151515;
      border-radius: 5px;
      text-decoration: none;
      color: #fff;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 15px 25px;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    .platform-card:hover {
      background: #202020;
      border-color: #555;
      transform: translateY(-4px);
    }

    .platform-card .brand-symbol {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .platform-card .brand-symbol i {
      font-size: 65px;
      line-height: 1;
    }

    .platform-card .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .platform-card .brand-action {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      letter-spacing: 1.3px;
      color: #999;
    }

    /* DEEZER LOGO */

    .deezer-symbol {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 48px;
    }

    .deezer-symbol span {
      display: block;
      width: 9px;
      background: #f2f2f2;
      border-radius: 1px;
    }

    .deezer-symbol span:nth-child(1) {
      height: 18px;
    }

    .deezer-symbol span:nth-child(2) {
      height: 31px;
    }

    .deezer-symbol span:nth-child(3) {
      height: 44px;
    }

    .deezer-symbol span:nth-child(4) {
      height: 27px;
    }

    /* FEATURED SPOTIFY PLAYER */

    .featured-player {
      width: 100%;
      max-width: 650px;
      margin-top: 48px;
      text-align: center;
    }

    .featured-player h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #999;
      margin-bottom: 18px;
    }

    .featured-player iframe {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: 12px;
    }

    .bandcamp-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #aaa;
      text-decoration: none;
    }

    .bandcamp-link:hover {
      color: #fff;
    }

    /* FOOTER */

    body .site-footer {
      width: 100%;
      padding: 0 20px 23px;
      flex-shrink: 0;
      text-align: center;
    }

    .footer-content,
    .footer-socials {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-content {
      gap: 20px;
    }

    .footer-socials {
      gap: 17px;
    }

    .footer-socials a {
      display: inline-flex;
      color: #aaa;
      font-size: 15px;
      text-decoration: none;
    }

    .footer-socials a:hover {
      color: #fff;
    }

    .footer-handle {
      margin: 0 !important;
      color: #999;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .music-layout {
        padding: 35px 16px 55px;
      }

      .platform-grid {
        grid-template-columns: 1fr;
        max-width: 420px;
        gap: 14px;
      }

      .platform-card {
        height: 165px;
        padding: 18px;
      }

      .platform-card .brand-symbol {
        height: 50px;
      }

      .platform-card .brand-symbol i {
        font-size: 42px;
      }

      .deezer-symbol {
        transform: scale(0.75);
      }

      .featured-player {
        margin-top: 35px;
      }
    }
  </style>
</head>

<body>
