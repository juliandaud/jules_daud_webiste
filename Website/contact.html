
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Contact | Jules Daud</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    /* GENERAL LAYOUT */

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #080808;
    }

    body .header {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      padding: 28px 20px 10px;
    }

    /* CONTACT CENTER */

    .contact-page {
      flex: 1 0 auto;
      width: 100%;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 20px 35px;
    }

    .contact-content {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
    }

    .contact-content h1 {
      font-family: 'Archivo Narrow', sans-serif;
      font-size: clamp(46px, 5vw, 62px);
      font-weight: 500;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .contact-subtitle {
      color: #999;
      font-size: 10px;
      letter-spacing: 1.8px;
      margin-bottom: 26px;
    }

    /* FORM */

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #555;
      border-radius: 0;
      padding: 11px 4px;
      color: #fff;
      font: 13px 'Space Grotesk', sans-serif;
      outline: none;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-bottom-color: #fff;
    }

    .contact-form textarea {
      min-height: 75px;
      resize: vertical;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #888;
    }

    .contact-form button {
      margin-top: 10px;
      padding: 13px;
      border: none;
      background: #eee;
      color: #111;
      cursor: pointer;
      font: 600 11px 'Space Grotesk', sans-serif;
      letter-spacing: 2px;
      transition: background 0.2s;
    }

    .contact-form button:hover {
      background: #bbb;
    }

    .contact-email {
      display: inline-block;
      margin-top: 22px;
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
    }

    .contact-email:hover {
      color: #fff;
    }

    /* FOOTER - SAME AS INDEX */

    body .site-footer {
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 22px;
      text-align: center;
      flex-shrink: 0;
    }

    .footer-content {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .footer-socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 17px;
    }

    .footer-socials a {
      display: inline-flex;
      align-items: center;
      color: #aaa;
      font-size: 15px;
      transition: color 0.2s;
    }

    .footer-socials a:hover {
      color: #fff;
    }

    .footer-handle {
      margin: 0 !important;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #999;
      white-space: nowrap;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      body .header {
        padding: 22px 12px 8px;
      }

      .contact-page {
        padding: 25px 20px 30px;
      }

      .contact-content h1 {
        font-size: 50px;
      }

      .contact-form {
        gap: 10px;
      }

      body .site-footer {
        padding-bottom: 18px;
      }

      .footer-content {
        gap: 15px;
      }

      .footer-socials {
        gap: 14px;
      }

      .footer-socials a {
        font-size: 14px;
      }

      .footer-handle {
        font-size: 10px;
      }
    }

    @media (min-height: 700px) and (min-width: 701px) {
      body {
        height: 100dvh;
        overflow: hidden;
      }

      .contact-page {
        flex: 1 1 auto;
      }
    }

  </style>

</head>

<body>

  <!-- MENU -->
  <header class="header">
    <nav class="menu" aria-label="Main navigation">
      <a href="index.html">HOME</a>
      <a href="music.html">MUSIC</a>
      <a href="videos.html">VIDEOS</a>
      <a href="shows.html">SHOWS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html" class="active">CONTACT</a>
    </nav>
  </header>

  <!-- CONTACT -->
  <main class="contact-page">

    <div class="contact-content">

      <h1>CONTACT</h1>

      <p class="contact-subtitle">
        BOOKING / PRESS / GENERAL INQUIRIES
      </p>

      <form class="contact-form" id="contact-form">

        <input
          type="text"
          name="name"
          placeholder="YOUR NAME"
          autocomplete="name"
          required>

        <input
          type="email"
          name="email"
          placeholder="EMAIL ADDRESS"
          autocomplete="email"
          required>

        <input
          type="text"
          name="subject"
          placeholder="SUBJECT"
          required>

        <textarea
          name="message"
          placeholder="YOUR MESSAGE"
          required></textarea>

        <button type="submit">
          SEND MESSAGE →
        </button>

      </form>

      <a class="contact-email"
         href="mailto:jules.daud@gmail.com">
        jules.daud@gmail.com
      </a>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-content">

      <div class="footer-socials">

        <a href="https://www.instagram.com/julesdaud/"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>

        <a href="https://www.youtube.com/channel/UCAIjXxr15PL6oAWZt9w_MTg"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="YouTube">
          <i class="bi bi-youtube"></i>
        </a>

        <a href="https://open.spotify.com/artist/1tNRwa7nMv1Mn95KSxdQKI"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Spotify">
          <i class="bi bi-spotify"></i>
        </a>

      </div>

      <p class="footer-handle">@JULESDAUD</p>

    </div>

  </footer>

  <!-- CONTACT EMAIL SCRIPT -->
  <script>
    document.getElementById('contact-form')
      .addEventListener('submit', function(event) {

        event.preventDefault();

        const form = event.currentTarget;

        const name =
          form.elements.namedItem('name').value;

        const email =
          form.elements.namedItem('email').value;

        const subject =
          form.elements.namedItem('subject').value;

        const message =
          form.elements.namedItem('message').value;

        const body =
          `Name: ${name}\n` +
          `Email: ${email}\n\n` +
          `${message}`;

        window.location.href =
          'mailto:jules.daud@gmail.com' +
          '?subject=' + encodeURIComponent(subject) +
          '&body=' + encodeURIComponent(body);

      });
  </script>

</body>
</html>
